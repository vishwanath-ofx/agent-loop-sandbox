name: Deploy prod

# Ships every merge to main once the tests pass on main. No approval step. Agent PRs are merged with
# the agent's GitHub App token, so their merge pushes trigger this too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one midway.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The environment only allows main; it has no reviewers.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: echo "Would deploy ${GITHUB_SHA} to prod"
      # Squash commits carry the PR body, which names the Linear issue ("Linear: PLA-123"). Shipped = Done.
      - name: Mark the Linear issue Done
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          issue="$(git log -1 --format=%B | sed -n 's/^Linear: \([A-Z]*-[0-9]*\)$/\1/p' | head -1)"
          if [ -n "$issue" ]; then node scripts/linear.mjs status "$issue" "Done" && echo "$issue -> Done"; else echo "no Linear issue in this commit"; fi
